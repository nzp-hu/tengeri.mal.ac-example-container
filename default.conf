server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;  # if IPv6 is needed

    server_name  tengeri.mal.ac localhost 127.0.0.1;  # This might need changes

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;  # gif/mp4/etc don't need compression

    location ~* \.(gif|mp4|png|jpg)$ { expires 30d; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
